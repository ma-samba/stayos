services:

  # ─────────────────────────────────────────
  # PHP-FPM (Symfony backend)
  # ─────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stayos_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: /var/www/backend/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/backend/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAILER_DSN: smtp://mailpit:1025
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MERCURE_URL: http://mercure:9090/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
      APP_DOMAIN: ${APP_DOMAIN:-stayos.localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - stayos_net

  # ─────────────────────────────────────────
  # Nginx (reverse proxy)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: stayos_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - stayos_net

  # ─────────────────────────────────────────
  # PostgreSQL (multi-schema)
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: stayos_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stayos_net

  # ─────────────────────────────────────────
  # Redis (cache + sessions + queue)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stayos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stayos_net

  # ─────────────────────────────────────────
  # Mercure (SSE temps réel)
  # ─────────────────────────────────────────
  mercure:
    image: dunglas/mercure
    container_name: stayos_mercure
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      SERVER_NAME: ':9090'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins "*"
        anonymous
    networks:
      - stayos_net

  # ─────────────────────────────────────────
  # Mailpit (catch-all mail dev)
  # ─────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: stayos_mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web
    networks:
      - stayos_net

  # ─────────────────────────────────────────
  # Vue.js frontend (Vite dev server)
  # ─────────────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: stayos_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8081/api
      VITE_MERCURE_URL: http://localhost:9090/.well-known/mercure
      VITE_APP_DOMAIN: ${APP_DOMAIN:-stayos.localhost}
    networks:
      - stayos_net

  # ─────────────────────────────────────────
  # Symfony Messenger Worker
  # ─────────────────────────────────────────
  messenger:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stayos_messenger
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MERCURE_URL: http://mercure:9090/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - stayos_net

volumes:
  postgres_data:
  redis_data:

networks:
  stayos_net:
    driver: bridge
