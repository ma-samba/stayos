server {
    listen 80;
    server_name ~^(?<tenant_slug>.+)\.localhost$ localhost;
    root /var/www/backend/public;
    index index.php;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/stayos_access.log;
    error_log  /var/log/nginx/stayos_error.log;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Front controller Symfony ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────────────────
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_TENANT_SLUG $tenant_slug;
        fastcgi_read_timeout 120;
        internal;
    }

    # ── Bloquer les autres .php ───────────────────────────────────────────────
    location ~ \.php$ {
        return 404;
    }

    # ── Assets statiques ─────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|pdf)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── Sécurité ─────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
