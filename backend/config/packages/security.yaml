security:
    password_hashers:
        App\Platform\User\Domain\Entity\User:
            algorithm: auto
        App\Platform\Auth\Domain\Entity\StaffUser:
            algorithm: auto

    providers:
        platform_user_provider:
            entity:
                class: App\Platform\User\Domain\Entity\User
                property: email
        staff_user_provider:
            id: App\Platform\Auth\Infrastructure\Security\TenantUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        health:
            pattern: ^/api/health$
            security: false

        paydunya_ipn:
            pattern: ^/api/payments/paydunya/ipn$
            security: false

        onboarding:
            pattern: ^/api/onboarding
            security: false

        public_invitations:
            pattern: ^/public/invitations
            security: false

        send_otp:
            pattern: ^/api/auth/send-otp$
            security: false

        verify_otp:
            pattern: ^/api/auth/verify-otp$
            security: false

        login:
            pattern: ^/api/auth/login$
            stateless: true
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            provider: staff_user_provider

        refresh:
            pattern: ^/api/auth/refresh$
            stateless: true

        superadmin_login:
            pattern: ^/superadmin/auth/login$
            stateless: true
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            json_login:
                check_path: /superadmin/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            provider: platform_user_provider

        superadmin:
            pattern: ^/superadmin
            stateless: true
            jwt: ~
            provider: platform_user_provider

        api:
            pattern: ^/api
            stateless: true
            jwt: ~
            provider: staff_user_provider

    access_control:
        - { path: ^/api/health,          roles: PUBLIC_ACCESS }
        - { path: ^/api/payments/paydunya/ipn, roles: PUBLIC_ACCESS }
        - { path: ^/api/onboarding,      roles: PUBLIC_ACCESS }
        - { path: ^/public/invitations,  roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login,      roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh,    roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/send-otp,   roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-otp, roles: PUBLIC_ACCESS }
        - { path: ^/api, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/superadmin, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/superadmin/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/superadmin,          roles: ROLE_SUPER_ADMIN }
        - { path: ^/api,                 roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

        ROLE_MANAGER:
            - ROLE_ACCESS_ROOMS
            - ROLE_ACCESS_GUESTS
            - ROLE_ACCESS_RESERVATIONS
            - ROLE_ACCESS_BILLING
            - ROLE_ACCESS_HOUSEKEEPING
            - ROLE_ACCESS_REPORTS
            - ROLE_USER

        ROLE_RECEPTIONIST:
            - ROLE_ACCESS_ROOMS
            - ROLE_ACCESS_GUESTS
            - ROLE_ACCESS_RESERVATIONS
            - ROLE_ACCESS_BILLING
            - ROLE_ACCESS_HOUSEKEEPING
            - ROLE_USER

        ROLE_ACCOUNTANT:
            - ROLE_ACCESS_ROOMS
            - ROLE_ACCESS_BILLING
            - ROLE_ACCESS_REPORTS
            - ROLE_USER

        ROLE_HOUSEKEEPER:
            - ROLE_ACCESS_HOUSEKEEPING
            - ROLE_USER
