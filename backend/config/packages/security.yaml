# SPRINT 1 — Version minimale sans JWT ni entités User/StaffUser
# Les firewalls JWT et providers seront activés au Sprint 2

security:
    password_hashers:
        # Interface générique — les entités User/StaffUser seront ajoutées au Sprint 2
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Providers réels ajoutés au Sprint 2 (Auth & StaffUser)
        # platform_user_provider: App\Platform\User\Domain\Entity\User
        # staff_user_provider: App\Platform\Tenant\Infrastructure\Security\TenantUserProvider
        in_memory:
            memory: ~

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        health:
            pattern: ^/api/health$
            security: false

        onboarding_register:
            pattern: ^/api/onboarding/register$
            security: false

        # Firewall ouvert pour le Sprint 1 — JWT ajouté au Sprint 2
        api:
            pattern: ^/api
            security: false

    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
