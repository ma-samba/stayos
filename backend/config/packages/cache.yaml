framework:
    cache:
        # Sprint 14-B.2.2 — Pool dédié pour les KPIs dashboard.
        # En dev/prod : Redis (provider construit à partir de REDIS_URL).
        # En test : override en cache.adapter.array via when@test plus bas
        # (pour ne pas dépendre d'un Redis en CI).
        default_redis_provider: '%env(REDIS_URL)%'
        pools:
            kpi.cache:
                adapter: cache.adapter.redis
                default_lifetime: 300

when@test:
    framework:
        cache:
            pools:
                kpi.cache:
                    adapter: cache.adapter.array
                    default_lifetime: 300
