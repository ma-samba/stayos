lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 3600       # 1 heure (refresh_ttl géré par gesdinet/jwt-refresh-token-bundle)

    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization

    # Claims personnalisés enrichis avec les infos tenant
    # Voir App\Platform\Tenant\Infrastructure\Security\JWTCreatedListener
    # Claims ajoutés : tenant, role, plan, features, hotel
